<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLEASE HOLD</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="dust-overlay"></div>
<div id="game-container">
  <h1>PLEASE HOLD</h1>
  <div id="subtitle">Your call is important to us.</div>

  <!-- PRE-GAME -->
  <div id="pre-call">
    <p class="premise">You need to dispute a charge on your statement. It's $1.47.</p>
    <p class="premise">It's the principle of the thing.</p>
    <button id="call-btn" class="btn btn-call">[ Call Meridian Solutions Inc. ]</button>
  </div>

  <!-- MAIN GAME AREA -->
  <div id="game-area">
    <div id="phone-bar"></div>
    <div id="panels">
      <div id="panel-left"></div>
      <div id="panel-center"><h2>Coping Mechanisms</h2><div id="gen-list"></div></div>
      <div id="panel-right"><h2>Upgrades</h2><div id="upgrade-list"></div><div id="dust-section" style="display:none"><h3>Dust Collectors</h3><div id="dust-list"></div></div></div>
    </div>
    <div id="footer">
      <div id="flavor-box"><p id="flavor-text"></p></div>
      <div id="log"></div>
    </div>
  </div>

  <!-- PHASE TRANSITIONS -->
  <div id="transition-screen" style="display:none"></div>

  <!-- HANGUP SCREEN -->
  <div id="hangup-scr" style="display:none">
    <p id="hangup-txt"></p>
    <button id="redial-btn" class="btn btn-call">[ Redial ]</button>
  </div>

  <!-- WIN SCREEN -->
  <div id="win-screen"></div>
</div>

<script src="js/balance.js"></script>
<script src="js/numbers.js"></script>
<script src="js/flavor.js"></script>
<script src="js/save.js"></script>
<script src="js/ui.js"></script>
<script src="js/phase1.js"></script>
<script src="js/phase2.js"></script>
<script src="js/phase3.js"></script>
<script src="js/dust.js"></script>
<script src="js/main.js"></script>
</body>
</html>
